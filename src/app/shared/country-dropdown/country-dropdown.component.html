<ion-button fill="none" id="select-fruits">{{ currentUser && currentUser.country ? currentUser.country : 'Select Country' }}</ion-button>
<ion-modal trigger="select-fruits" #modal>
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>{{ currentUser && currentUser.country ? currentUser.country : 'Select Country' }}</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="confirmChanges();">Done</ion-button>
        </ion-buttons>
      </ion-toolbar>
      <ion-toolbar>
        <ion-searchbar (ionInput)="searchbarInput($event)"></ion-searchbar>
      </ion-toolbar>
    </ion-header>

    <ion-content color="light">
      <ion-list class="ion-no-margin">
        @for (flag of filteredFlags; track flag.name) {
        <ion-item>          
          <ion-avatar slot="start">
            <img [src]="flag.url">
          </ion-avatar>          
          <ion-checkbox
            [value]="flag.code"
            [checked]="selectedCountryCode==flag.code"
            (ionChange)="checkboxChange($event, flag)"
            >{{ flag.name }}</ion-checkbox>
        </ion-item>
        }
      </ion-list>
    </ion-content>
  </ng-template>
</ion-modal>
